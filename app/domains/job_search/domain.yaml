id: job_search
display_name: Job Search / Career Context
status: mvp
source_grounded: true
accepted_mime_types:
  - text/plain
  - application/pdf
unsupported_inputs:
  - images
  - OCR
  - audio
  - video
  - web lookup
artifact_types:
  - id: job_description
    display_name: Job Description
    extractor_ids:
      - job-description-extractor
  - id: resume
    display_name: Resume
    extractor_ids:
      - resume-extractor
  - id: recruiter_message
    display_name: Recruiter Message
    extractor_ids: []
  - id: interview_notes
    display_name: Interview Notes
    extractor_ids:
      - interview-notes-extractor
  - id: company_research
    display_name: Company Research
    extractor_ids: []
  - id: personal_story
    display_name: Personal Story
    extractor_ids:
      - personal-story-extractor
  - id: compensation_notes
    display_name: Compensation Notes
    extractor_ids: []
  - id: follow_up_notes
    display_name: Follow-Up Notes
    extractor_ids: []
views:
  - id: role_fit
    display_name: Role Fit
    description: Source-grounded fit, evidence gaps, risks, and positioning.
  - id: interview_prep
    display_name: Interview Prep
    description: Interview themes, supporting stories, topics, and concerns.
  - id: resume_positioning
    display_name: Resume Positioning
    description: Resume evidence and rewrite suggestions.
  - id: application_pipeline
    display_name: Application Pipeline
    description: Opportunities, next actions, blockers, and follow-ups.
  - id: compensation_scope_risk
    display_name: Compensation and Scope Risk
    description: Compensation signals, scope risk, and judgment areas.
extractors:
  - job-description-extractor
  - resume-extractor
  - interview-notes-extractor
  - personal-story-extractor
task_generators:
  - job-search-task-generator
