apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rust-sbc-gateway.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rust-sbc-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rust-sbc-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rust-sbc-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: control
              containerPort: {{ .Values.service.controlTargetPort }}
              protocol: TCP
            - name: ws
              containerPort: {{ .Values.service.wsTargetPort }}
              protocol: TCP
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
          envFrom:
            - configMapRef:
                name: {{ include "rust-sbc-gateway.fullname" . }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: control
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: control
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
