namespace: demo

replicaCount: 1

image:
  repository: backend-api
  tag: "dev"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: traefik
  annotations: {}
  path: /api
  pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 400m
    memory: 384Mi

probes:
  livenessPath: /health
  readinessPath: /ready
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

configEnv:
  APP_NAME: "Backend API"
  ENVIRONMENT: "demo"
  LOG_LEVEL: "INFO"
  HOST: "0.0.0.0"
  PORT: "8000"
  DB_DSN: ""
  DB_USER: ""
  RUN_MIGRATIONS_ON_STARTUP: "true"
  ACCESS_TOKEN_TTL_SECONDS: "604800"
  DEFAULT_WORKFLOW_KEY: "messy-notes-v1"
  WORKFLOW_CONFIG_DIR: "app/resources/workflows"
  POST_PROCESSOR_CONFIG_PATH: "app/resources/post_processors/post-processors.yaml"
  MAX_FILES_PER_RUN: "3"
  MAX_FILE_SIZE_BYTES: "5242880"
  MAX_EXTRACTED_TEXT_BYTES: "250000"
  MAX_TOTAL_WORKFLOW_TEXT_BYTES: "400000"
  EMAIL_PROVIDER: "stub"
  INVITE_EMAIL_BASE_URL: "https://demo.lebedev.ai"
  INVITE_EMAIL_DRAFT_PROVIDER: "openai"
  INVITE_EMAIL_DRAFT_MODEL: "gpt-5-mini"
  OCI_EMAIL_SMTP_PORT: "587"

secretEnv: {}
existingSecretName: ""

nameOverride: ""
fullnameOverride: ""
