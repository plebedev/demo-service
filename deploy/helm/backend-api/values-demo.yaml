namespace: demo

configEnv:
  APP_NAME: "Backend API"
  ENVIRONMENT: "demo"
  LOG_LEVEL: "INFO"
  HOST: "0.0.0.0"
  PORT: "8000"
  DB_DSN: "(description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.us-ashburn-1.oraclecloud.com))(connect_data=(service_name=gd70f35d5708eaf_prototypedb_tp.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))"
  DB_USER: "APP_RW"
  RUN_MIGRATIONS_ON_STARTUP: "true"
  ACCESS_TOKEN_TTL_SECONDS: "604800"
  MAX_FILES_PER_RUN: "3"
  MAX_FILE_SIZE_BYTES: "5242880"
  MAX_EXTRACTED_TEXT_BYTES: "250000"
  MAX_TOTAL_WORKFLOW_TEXT_BYTES: "400000"
  RAG_ORACLE_EMBEDDING_MODEL: "MINILM_L12_V2"
  RAG_ORACLE_CHUNKING_PROVIDER: "rust"
  TEXT_TOOLS_ENABLED: "true"
  TEXT_TOOLS_BASE_URL: "http://text-tools.demo.svc.cluster.local"
  TEXT_TOOLS_TIMEOUT_SECONDS: "2"
  EMAIL_PROVIDER: "oci"
  INVITE_EMAIL_BASE_URL: "https://demo.lebedev.ai"
  INVITE_EMAIL_DRAFT_PROVIDER: "openai"
  INVITE_EMAIL_DRAFT_MODEL: "gpt-5-mini"
  OCI_EMAIL_SMTP_PORT: "587"
  SMS_NOTIFICATION_ENABLED: "false"
  VOICE_XAI_MODEL: "grok-voice-think-fast-1.0"
  VOICE_GREETING_PROVIDER: "openai"
  VOICE_GREETING_MODEL: "gpt-4o-mini"

existingSecretName: "backend-api-secrets"

ingress:
  enabled: true
  className: traefik
  annotations: {}
  path: /api/webhooks/twilio/sms
  pathType: Prefix
