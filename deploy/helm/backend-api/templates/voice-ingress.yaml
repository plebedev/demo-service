{{- if .Values.voiceIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "backend-api.fullname" . }}-voice
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "backend-api.labels" . | nindent 4 }}
  {{- with .Values.voiceIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.voiceIngress.className }}
  rules:
    - http:
        paths:
          {{- range .Values.voiceIngress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "backend-api.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
{{- end }}
