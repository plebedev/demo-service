namespace: demo

replicaCount: 1

image:
  repository: demo-text-tools
  tag: "dev"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  livenessPath: /health
  readinessPath: /health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

configEnv:
  TEXT_TOOLS_HOST: "0.0.0.0"
  TEXT_TOOLS_PORT: "8081"
  RUST_LOG: "info"

nameOverride: ""
fullnameOverride: ""
