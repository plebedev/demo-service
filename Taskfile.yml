version: "3"

vars:
  SRC_DIR: '{{default "app" .SRC_DIR}}'

tasks:
  install:
    cmds:
      - poetry install

  reformat:
    desc: >-
      Reformat the codebase.
    cmds:
        - poetry run black {{.SRC_DIR}}

  lint:
    cmds:
      - poetry run mypy {{.SRC_DIR}}
      - PYTHONPYCACHEPREFIX=/tmp/backend-api-pyc poetry run python -m compileall {{.SRC_DIR}}
      - poetry run black --workers 1 --check --diff {{.SRC_DIR}}
      - poetry run pydocstyle {{.SRC_DIR}}

  verify:
    cmds:
      - bash -lc 'poetry run mypy {{.SRC_DIR}} && PYTHONPYCACHEPREFIX=/tmp/backend-api-pyc poetry run python -m compileall {{.SRC_DIR}} && poetry run black --workers 1 --check --diff {{.SRC_DIR}} && poetry run pydocstyle {{.SRC_DIR}} && poetry run python -m pytest && PYTHONPYCACHEPREFIX=/tmp/backend-api-pyc poetry run python -m compileall app alembic'

  test:
    cmds:
      - poetry run python -m pytest

  dev:
    cmds:
      - poetry run uvicorn app.main:create_app --factory --reload --host 0.0.0.0 --port 8000

  build:
    cmds:
      - PYTHONPYCACHEPREFIX=/tmp/backend-api-pyc poetry run python -m compileall app alembic

  local-up:
    cmds:
      - bash ./local/scripts/up.sh

  local-down:
    cmds:
      - bash ./local/scripts/down.sh

  local-logs:
    cmds:
      - bash ./local/scripts/logs.sh

  democtl:build:
    desc: >-
      Build the local Rust demo operator CLI.
    dir: local/democtl
    cmds:
      - cargo build

  democtl:test:
    desc: >-
      Run the local Rust demo operator CLI tests.
    dir: local/democtl
    cmds:
      - cargo test

  democtl:run:
    desc: >-
      Run the local Rust demo operator CLI.
    dir: local/democtl
    cmds:
      - cargo run -- {{.CLI_ARGS}}

  migrate:
    cmds:
      - poetry run python -m alembic upgrade head

  makemigration:
    cmds:
      - test -n "${MESSAGE:-}" || (echo "Set MESSAGE=..." && exit 1)
      - poetry run python -m alembic revision --autogenerate -m "${MESSAGE}"

  docker-build:
    cmds:
      - IMAGE_REPOSITORY="${IMAGE_REPOSITORY:-backend-api}" IMAGE_TAG="${IMAGE_TAG:-}" bash ./deploy/scripts/build-image.sh

  save-image:
    cmds:
      - IMAGE_REPOSITORY="${IMAGE_REPOSITORY:-backend-api}" IMAGE_TAG="${IMAGE_TAG:-}" bash ./deploy/scripts/save-image.sh

  apply-runtime-secret:
    cmds:
      - 'test -n "{{.CLI_ARGS}}" || (echo "Usage: task apply-runtime-secret -- SECRET_KEY SECRET_VALUE [SECRET_KEY SECRET_VALUE ...]" && exit 1)'
      - 'SECRET_NAME="${SECRET_NAME:-backend-api-secrets}" NAMESPACE="${NAMESPACE:-demo}" bash ./deploy/scripts/apply-runtime-secret.sh {{.CLI_ARGS}}'

  copy-bundle:
    cmds:
      - IMAGE_REPOSITORY="${IMAGE_REPOSITORY:-backend-api}" IMAGE_TAG="${IMAGE_TAG:-}" DEPLOY_TARGET="${DEPLOY_TARGET:-ubuntu@openclaw}" DEPLOY_PATH="${DEPLOY_PATH:-/home/ubuntu/backend-api-deploy}" SSH_OPTS="${SSH_OPTS:-}" bash ./deploy/scripts/copy-deploy-bundle.sh

  deploy:
    cmds:
      - RELEASE_NAME="${RELEASE_NAME:-backend-api}" NAMESPACE="${NAMESPACE:-demo}" VALUES_FILE="${VALUES_FILE:-deploy/helm/backend-api/values-demo.yaml}" IMAGE_REPOSITORY="${IMAGE_REPOSITORY:-backend-api}" IMAGE_TAG="${IMAGE_TAG:-}" bash ./deploy/scripts/deploy.sh

  ship-deploy:
    cmds:
      - RELEASE_NAME="${RELEASE_NAME:-backend-api}" NAMESPACE="${NAMESPACE:-demo}" VALUES_FILE="${VALUES_FILE:-deploy/helm/backend-api/values-demo.yaml}" IMAGE_REPOSITORY="${IMAGE_REPOSITORY:-backend-api}" DEPLOY_TARGET="${DEPLOY_TARGET:-ubuntu@openclaw}" DEPLOY_PATH="${DEPLOY_PATH:-/home/ubuntu/backend-api-deploy}" SSH_OPTS="${SSH_OPTS:-}" KEEP_REMOTE_RELEASES="${KEEP_REMOTE_RELEASES:-3}" bash ./deploy/scripts/ship-deploy.sh

  rollback:
    cmds:
      - RELEASE_NAME="${RELEASE_NAME:-backend-api}" NAMESPACE="${NAMESPACE:-demo}" REVISION="${REVISION:-}" bash ./deploy/scripts/rollback.sh

  history:
    cmds:
      - helm history "${RELEASE_NAME:-backend-api}" --namespace "${NAMESPACE:-demo}"
