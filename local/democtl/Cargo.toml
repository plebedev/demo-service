[package]
name = "democtl"
version = "0.1.0"
edition = "2021"
description = "Local operator CLI for the demo-service API"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7.1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.15"
