[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "backend-api"
version = "0.1.0"
description = "Production-like FastAPI backend starter for k3s"
authors = ["Plebedev"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
alembic = "1.14.1"
fastapi = ">=0.123.4,<0.124"
oracledb = "3.4.2"
psycopg = { version = "3.3.3", extras = ["binary"] }
pydantic = "2.12.2"
pydantic-settings = "2.13.1"
sqlalchemy = "2.0.39"
uvicorn = { version = "0.34.0", extras = ["standard"] }
starlette = ">=0.48,<0.49"

[tool.poetry.group.dev.dependencies]
black = "25.1.0"
httpx = "0.28.1"
mypy = "1.18.2"
pydocstyle = "6.3.0"
pytest = "8.3.5"
testcontainers = ">=4.14,<4.15"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["oracledb.*"]
ignore_missing_imports = true

[tool.pydocstyle]
convention = "pep257"
add-ignore = ["D104", "D105", "D107", "D203", "D213"]
match-dir = "(?!alembic$).*"
